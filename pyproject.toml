[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aion-language"
version = "0.1.0.dev0"
description = "Experimental AION parser and static semantic validator"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
aion = "aion.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
